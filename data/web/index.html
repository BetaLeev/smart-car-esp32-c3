<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能小车控制</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #00d9ff;
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-label {
            color: #888;
            font-size: 14px;
        }

        .status-value {
            color: #00d9ff;
            font-weight: bold;
        }

        .wifi-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        input[type="text"],
        input[type="password"] {
            padding: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #00d9ff;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #00d9ff;
            color: #1a1a2e;
        }

        .btn-primary:hover {
            background: #00b8d9;
        }

        .btn-primary:disabled {
            background: #555;
            cursor: not-allowed;
        }

        .speed-control {
            margin-top: 15px;
        }

        .speed-control label {
            display: block;
            margin-bottom: 8px;
            color: #888;
        }

        input[type="range"] {
            width: 100%;
            height: 8px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.2);
            appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            appearance: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #00d9ff;
            cursor: pointer;
        }

        .speed-value {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            color: #00d9ff;
            margin-top: 8px;
        }

        .control-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            max-width: 250px;
            margin: 20px auto;
        }

        .control-btn {
            aspect-ratio: 1;
            font-size: 24px;
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            border: 2px solid transparent;
        }

        .control-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            border-color: #00d9ff;
        }

        .control-btn:active {
            background: #00d9ff;
            color: #1a1a2e;
        }

        .control-btn.forward {
            grid-column: 2;
        }

        .control-btn.left {
            grid-column: 1;
            grid-row: 2;
        }

        .control-btn.stop {
            grid-column: 2;
            grid-row: 2;
            background: #ff4757;
        }

        .control-btn.right {
            grid-column: 3;
            grid-row: 2;
        }

        .control-btn.backward {
            grid-column: 2;
            grid-row: 3;
        }

        .command-display {
            text-align: center;
            padding: 10px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            margin-top: 15px;
        }

        .command-label {
            color: #888;
            font-size: 14px;
        }

        .command-value {
            font-size: 18px;
            font-weight: bold;
            color: #00d9ff;
            text-transform: uppercase;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            padding: 12px 24px;
            border-radius: 8px;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 1000;
        }

        .toast.show {
            opacity: 1;
        }

        .toast.error {
            border-left: 4px solid #ff4757;
        }

        .toast.success {
            border-left: 4px solid #2ed573;
        }

        .connection-status {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ff4757;
        }

        .status-dot.connected {
            background: #2ed573;
            box-shadow: 0 0 10px #2ed573;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>智能小车控制</h1>

        <!-- Wi-Fi 状态 -->
        <div class="card">
            <div class="status-bar">
                <div class="connection-status">
                    <div class="status-dot" id="wifiDot"></div>
                    <span id="wifiStatus">未连接</span>
                </div>
                <div class="status-item">
                    <span class="status-label">IP:</span>
                    <span class="status-value" id="ipAddress">--</span>
                </div>
                <div class="status-item">
                    <span class="status-label">SSID:</span>
                    <span class="status-value" id="ssid">--</span>
                </div>
            </div>
        </div>

        <!-- Wi-Fi 连接 -->
        <div class="card">
            <div class="wifi-form">
                <input type="text" id="ssidInput" placeholder="Wi-Fi 名称">
                <input type="password" id="passwordInput" placeholder="Wi-Fi 密码">
                <button class="btn-primary" id="connectBtn" onclick="connectWifi()">连接 Wi-Fi</button>
            </div>
        </div>

        <!-- 速度控制 -->
        <div class="card">
            <div class="speed-control">
                <label>速度调节</label>
                <input type="range" id="speedSlider" min="0" max="100" value="50" oninput="updateSpeed()">
                <div class="speed-value"><span id="speedValue">50</span>%</div>
            </div>
        </div>

        <!-- 方向控制 -->
        <div class="card">
            <div class="control-grid">
                <button class="control-btn forward" ontouchstart="sendCommand('forward')" onmousedown="sendCommand('forward')" onmouseup="sendCommand('stop')" onmouseleave="sendCommand('stop')" ontouchend="sendCommand('stop')">▲</button>
                <button class="control-btn left" ontouchstart="sendCommand('left')" onmousedown="sendCommand('left')" onmouseup="sendCommand('stop')" onmouseleave="sendCommand('stop')" ontouchend="sendCommand('stop')">◀</button>
                <button class="control-btn stop" onclick="sendCommand('stop')">■</button>
                <button class="control-btn right" ontouchstart="sendCommand('right')" onmousedown="sendCommand('right')" onmouseup="sendCommand('stop')" onmouseleave="sendCommand('stop')" ontouchend="sendCommand('stop')">▶</button>
                <button class="control-btn backward" ontouchstart="sendCommand('backward')" onmousedown="sendCommand('backward')" onmouseup="sendCommand('stop')" onmouseleave="sendCommand('stop')" ontouchend="sendCommand('stop')">▼</button>
            </div>
            <div class="command-display">
                <span class="command-label">当前命令: </span>
                <span class="command-value" id="currentCommand">STOP</span>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        let currentSpeed = 50;

        // 显示提示
        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast show ' + type;
            setTimeout(() => {
                toast.className = 'toast';
            }, 3000);
        }

        // 连接 Wi-Fi
        async function connectWifi() {
            const ssid = document.getElementById('ssidInput').value.trim();
            const password = document.getElementById('passwordInput').value;
            const btn = document.getElementById('connectBtn');

            if (!ssid) {
                showToast('请输入 Wi-Fi 名称', 'error');
                return;
            }

            btn.disabled = true;
            btn.textContent = '连接中...';

            try {
                const response = await fetch('/api/wifi/connect', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ssid, password })
                });
                const data = await response.json();
                showToast(data.message, data.success ? 'success' : 'error');
            } catch (e) {
                showToast('连接失败', 'error');
            }

            btn.disabled = false;
            btn.textContent = '连接 Wi-Fi';
        }

        // 更新速度
        async function updateSpeed() {
            currentSpeed = document.getElementById('speedSlider').value;
            document.getElementById('speedValue').textContent = currentSpeed;
        }

        // 发送控制命令
        async function sendCommand(command) {
            document.getElementById('currentCommand').textContent = command.toUpperCase();

            try {
                await fetch('/api/control', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ command, speed: currentSpeed })
                });
            } catch (e) {
                showToast('命令发送失败', 'error');
            }
        }

        // 更新状态
        async function updateStatus() {
            try {
                const response = await fetch('/api/wifi/status');
                const data = await response.json();

                document.getElementById('wifiStatus').textContent = data.connected ? '已连接' : '未连接';
                document.getElementById('wifiDot').className = 'status-dot' + (data.connected ? ' connected' : '');
                document.getElementById('ipAddress').textContent = data.ip;
                document.getElementById('ssid').textContent = data.ssid || '--';
            } catch (e) {
                console.log('Status update failed');
            }
        }

        // 定期更新状态
        updateStatus();
        setInterval(updateStatus, 2000);
    </script>
</body>
</html>
