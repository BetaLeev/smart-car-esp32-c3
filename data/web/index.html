<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能小车控制面板</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>CAR CONTROL</h1>
            <p class="subtitle">智能小车车载控制终端</p>
        </header>

        <section class="card status-card">
            <div class="status-bar">
                <div class="connection-status">
                    <div class="status-dot" id="wifiDot"></div>
                    <span id="wifiStatus">未连接</span>
                </div>
                <div class="status-group">
                    <div class="status-item">
                        <span class="status-label">SIGNAL</span>
                        <span class="status-value signal-value" id="signalStrength">-- dBm</span>
                    </div>
                    <div class="status-item">
                        <span class="status-label">IP ADDRESS</span>
                        <span class="status-value" id="ipAddress">--</span>
                    </div>
                    <div class="status-item">
                        <span class="status-label">SSID</span>
                        <span class="status-value" id="ssid">--</span>
                    </div>
                </div>
            </div>
        </section>

        <section class="card">
            <h3 class="card-title">动力输出</h3>
            <div class="speed-control">
                <div class="speed-header">
                    <span class="speed-label">SPEED LIMIT</span>
                    <span class="speed-value"><span id="speedValue">50</span>%</span>
                </div>
                <input type="range" id="speedSlider" min="0" max="100" value="50">
            </div>
        </section>

        <section class="card control-panel">
            <h3 class="card-title">姿态控制</h3>
            <div class="control-grid">
                <button class="control-btn forward" data-cmd="forward">▲</button>
                <button class="control-btn left" data-cmd="left">◀</button>
                <button class="control-btn stop" data-cmd="stop">■</button>
                <button class="control-btn right" data-cmd="right">▶</button>
                <button class="control-btn backward" data-cmd="backward">▼</button>
            </div>

            <div class="command-display">
                <span class="command-label">CURRENT CMD</span>
                <span class="command-value" id="currentCommand">STOP</span>
            </div>
        </section>

        <section class="card">
            <h3 class="card-title">辅助设备</h3>
            <div class="aux-control">
                <button class="control-btn horn" id="hornBtn">喇叭</button>
            </div>
        </section>

        <section class="card">
            <h3 class="card-title">MEMORY MONITOR</h3>
            <div class="memory-grid">
                <div class="memory-item">
                    <div class="memory-item-header">
                        <span class="memory-label">FREE HEAP</span>
                        <span class="memory-value" id="freeHeap">-- KB</span>
                    </div>
                    <div class="memory-bar">
                        <div class="memory-bar-fill" id="freeHeapBar" style="width: 0%"></div>
                    </div>
                </div>
                <div class="memory-item">
                    <div class="memory-item-header">
                        <span class="memory-label">HEAP USED</span>
                        <span class="memory-value" id="usedHeap">-- KB</span>
                    </div>
                    <div class="memory-bar">
                        <div class="memory-bar-fill" id="usedHeapBar" style="width: 0%"></div>
                    </div>
                </div>
            </div>
            <div class="uptime-row">
                <span class="uptime-label">SYSTEM UPTIME</span>
                <span class="uptime-value" id="uptime">--</span>
            </div>
            <div class="uptime-row">
                <span class="uptime-label">MIN FREE HEAP</span>
                <span class="uptime-value" id="minFreeHeap">-- KB</span>
            </div>
            <div class="min-heap-warning">
                最低堆内存: <span id="minFreeHeapVal">--</span> KB
            </div>
        </section>
    </div>

    <div class="toast" id="toast"></div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
