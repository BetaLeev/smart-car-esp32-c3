 [env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = espidf
monitor_speed = 115200


; 禁用RTS/DTR，防止打开监视器时进入下载模式
monitor_rts = 0
monitor_dtr = 0

; Flash 大小 (4MB for ESP32-C3 SuperMini DIP-16)
board_build.flash_size = 4MB

; 添加组件头文件路径
build_flags =
    -Isrc
    -Isrc/wifi
    -Isrc/web
    -Isrc/ble

; 使用自定义组件目录
board_build.components_dirs =
    components

; 自定义分区表
board_build.partitions = partitions.csv

; SPIFFS 文件系统配置
board_build.filesystem = spiffs

; 确保上传时复位
upload_speed = 921600
